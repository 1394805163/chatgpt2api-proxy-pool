name: Publish root-cause-fix candidate image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/vps-snapshot-20260818
    paths:
      - .dockerignore
      - Dockerfile
      - config.container.json
      - pyproject.toml
      - uv.lock
      - VERSION
      - main.py
      - api/**
      - services/**
      - utils/**
      - scripts/**
      - web/**
      - .github/workflows/publish-root-cause-fix.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:root-cause-fix-20260820
