services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:proxy-pool
    container_name: ${CHATGPT2API_CONTAINER_NAME:-chatgpt2api}
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/accounts.db}
      MALLOC_ARENA_MAX: ${MALLOC_ARENA_MAX:-2}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?set CHATGPT2API_AUTH_KEY in .env}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
